<title>Японский в кармане</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one phone-first column, trip drawn as a Tokyo-metro line; each topic wears a real metro line colour */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#E3E8ED; --ink:#14181C; --muted:#56616C; --line:#D3DAE1;
  --accent:#BC002D; --accent-soft:#F9E4E8; --on-accent:#FFFFFF;
  --note:#FFF5D1; --note-ink:#4F3B00; --good:#1E8A4C; --bad:#C62828;
  --font-ui:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;
  --r:16px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1114; --surface:#181C21; --surface-2:#232930; --ink:#ECEFF3; --muted:#9BA6B2; --line:#2D343C;
  --accent:#FF5470; --accent-soft:#3A1720; --on-accent:#16070B;
  --note:#2D2712; --note-ink:#F1DB8E; --good:#4CC17E; --bad:#FF6B6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1114; --surface:#181C21; --surface-2:#232930; --ink:#ECEFF3; --muted:#9BA6B2; --line:#2D343C;
  --accent:#FF5470; --accent-soft:#3A1720; --on-accent:#16070B;
  --note:#2D2712; --note-ink:#F1DB8E; --good:#4CC17E; --bad:#FF6B6B; color-scheme:dark}

*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
[lang="ja"]{font-family:var(--font-jp)}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;height:56px;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none}
.brand-jp{font-weight:700;font-size:1.3rem;color:var(--accent)}
.brand-ru{font-weight:900;font-size:1rem;letter-spacing:.01em}
.top-actions{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);text-decoration:none;cursor:pointer}
.icon-btn .kana-ic{font-family:var(--font-jp);font-weight:700;font-size:1.15rem;line-height:1}

main{padding-block:20px calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 32px)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:800}
.tab.on{color:var(--accent)}
.tab.on .ic{stroke-width:2.3}

h1,h2,h3{text-wrap:balance;margin:0}
h1{font-weight:900;font-size:clamp(1.9rem,7vw,2.6rem);line-height:1.1;letter-spacing:-.01em}
h2{font-weight:900;font-size:1.3rem;line-height:1.2}
.lead{color:var(--muted);font-size:1.02rem;margin:10px 0 0;max-width:62ch}
.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sec{margin-top:32px;scroll-margin-top:72px}
.sec>h2{margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sec>h2 small{font-size:.8rem;color:var(--muted);font-weight:700}
.h-sm{font-size:1rem;font-weight:900;margin:22px 0 10px}
.stack{display:flex;flex-direction:column;gap:10px}

/* hero */
.hero{display:flex;flex-direction:column;gap:6px}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-weight:800;font-size:.9rem;font-variant-numeric:tabular-nums}
.stats span{display:flex;align-items:center;gap:6px}
.stats span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* quick chips */
.quick{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -2px}
.quick::-webkit-scrollbar{display:none}
.qchip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;max-width:200px}
.qchip .q-jp{font-family:var(--font-jp);font-weight:700;font-size:1.05rem;white-space:nowrap}
.qchip .q-ru{font-size:.8rem;color:var(--muted);font-weight:700;white-space:nowrap}

/* metro line map */
.linemap{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 14px}
.stop{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 0;text-decoration:none}
.stop::before{content:"";position:absolute;left:21px;top:0;bottom:0;width:6px;background:var(--lc)}
.stop:first-child::before{top:50%}
.stop:last-child::before{bottom:50%}
.stop+.stop{border-top:1px dashed var(--line)}
.badge{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;border:5px solid var(--lc);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none;font-variant-numeric:tabular-nums}
.badge b{font-size:.72rem;font-weight:900}
.badge i{font-style:normal;font-size:1rem;font-weight:900}
.badge.big{width:68px;height:68px;border-width:7px}
.badge.big b{font-size:.9rem}.badge.big i{font-size:1.35rem}
.stop-t{display:block;font-weight:900;font-size:1.05rem;line-height:1.25}
.stop-s{display:block;color:var(--muted);font-size:.88rem;line-height:1.3}
.stop-n{font-size:.78rem;color:var(--muted);font-weight:800;white-space:nowrap;display:flex;align-items:center;gap:2px}
.stop-n .ic{width:16px;height:16px}
.map-note{font-size:.82rem;color:var(--muted);margin:8px 2px 0}

/* tools grid */
.tools-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tool-tile{display:flex;flex-direction:column;gap:4px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;min-width:0}
.tool-tile .tt-jp{font-family:var(--font-jp);font-weight:700;font-size:1.5rem;color:var(--accent);line-height:1.2}
.tool-tile b{font-weight:900}
.tool-tile span{font-size:.86rem;color:var(--muted);line-height:1.35}

/* situation header */
.back{display:inline-flex;align-items:center;gap:4px;font-weight:800;color:var(--muted);text-decoration:none;font-size:.9rem;margin-bottom:6px}
.back .ic{width:18px;height:18px}
.track{position:relative;height:76px;display:flex;align-items:center;gap:12px}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;height:8px;margin-top:-4px;background:var(--lc);border-radius:4px}
.track .nexttag{position:relative;z-index:1;margin-left:auto;background:var(--surface);border:2px solid var(--lc);border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:800;color:var(--ink)}
.jump{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none;margin:0 -2px}
.jump::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:800;font-size:.88rem;cursor:pointer;text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px}

/* phrase card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.card.hear{border-style:dashed;border-width:2px}
.hear-tag{display:inline-block;font-size:.7rem;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.jp{font-family:var(--font-jp);font-weight:700;font-size:1.55rem;line-height:1.35;overflow-wrap:anywhere}
.kana{font-family:var(--font-jp);color:var(--muted);font-size:.9rem;line-height:1.4;overflow-wrap:anywhere}
.say{font-weight:900;font-size:1.12rem;color:var(--accent);margin-top:4px;line-height:1.3}
.romaji{color:var(--muted);font-style:italic;font-size:.9rem}
.mean{font-weight:800;margin-top:6px;line-height:1.35}
.en{font-size:.9rem;color:var(--muted);margin-top:2px}
.en span{font-size:.66rem;font-weight:900;letter-spacing:.06em;border:1px solid var(--line);border-radius:4px;padding:1px 4px;margin-right:4px;vertical-align:1px}
.note{margin:10px 0 0;background:var(--note);color:var(--note-ink);border-radius:10px;padding:8px 11px;font-size:.92rem;line-height:1.45}
.card-tools{display:flex;flex-direction:column;gap:6px}
.tool{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;padding:0}
.tool .ic{width:20px;height:20px}
.tool.sm{width:38px;height:38px}
.tool.fav.on{color:var(--accent);border-color:var(--accent)}
.tool.fav.on .ic{fill:currentColor}
.no-romaji .romaji{display:none}
.no-en .en{display:none}
.no-kana .kana,.no-kana .row-kana{display:none}

/* dialog */
.dlg{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.dlg-title{font-weight:800;color:var(--muted);font-size:.85rem}
.bub{max-width:88%;padding:10px 12px;border-radius:16px;background:var(--surface-2);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:start}
.bub.y{align-self:flex-end;background:var(--accent-soft);border-bottom-right-radius:4px}
.bub.t{align-self:flex-start;border-bottom-left-radius:4px}
.bub .who{grid-column:1/-1;font-size:.68rem;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.bub .jp{font-size:1.12rem}
.bub .say{font-size:.95rem;margin-top:0}
.bub .mean{font-weight:600;margin-top:2px;font-size:.92rem}
.bub .tool{width:34px;height:34px;background:transparent}

/* tips */
.tips{list-style:none;margin:0;padding:4px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tips li{position:relative;padding:11px 0 11px 28px;line-height:1.45}
.tips li+li{border-top:1px dashed var(--line)}
.tips li::before{content:"";position:absolute;left:3px;top:17px;width:12px;height:12px;border-radius:50%;border:3px solid var(--lc,var(--accent));background:var(--surface)}
.src{font-size:.85rem;color:var(--muted);margin:10px 2px 0}
.src a{color:var(--accent);font-weight:800}

/* figures */
.fig{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption,.cap{font-size:.9rem;color:var(--muted);margin-top:10px;line-height:1.45}
.fig h3{font-size:1rem;font-weight:900;margin-bottom:10px}
.figs{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.st{stroke:var(--ink);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.st-th{stroke-width:2}
.fl-s{fill:var(--surface)}.fl-2{fill:var(--surface-2)}.fl-a{fill:var(--accent)}.fl-as{fill:var(--accent-soft)}.fl-ink{fill:var(--ink)}.fl-m{fill:var(--muted)}
.tx{fill:var(--ink);font-family:var(--font-jp);font-weight:700}
.tx-ui{fill:var(--ink);font-family:var(--font-ui);font-weight:800}
.tx-m{fill:var(--muted);font-family:var(--font-ui);font-weight:700}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.two>div{min-width:0;text-align:center;font-size:.88rem;font-weight:700}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.step{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.step b{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:.8rem;font-weight:900}
.step span{font-size:.76rem;font-weight:700;line-height:1.25}
.legend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.legend div{min-width:0;font-size:.82rem;line-height:1.3;text-align:center}
.legend b{display:block;font-family:var(--font-jp);font-size:1rem}
.dirs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dir{background:var(--surface-2);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;min-width:0}
.dir svg{width:40px;height:40px}
.dir .d-jp{font-family:var(--font-jp);font-weight:700;font-size:1.2rem}
.dir .d-c{font-weight:900;color:var(--accent);font-size:.95rem}
.dir .d-r{font-size:.82rem;color:var(--muted);font-weight:700}
.tm{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:14px;align-items:center}
.tm ol,.bus ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.92rem;line-height:1.4}
@media (max-width:440px){.tm{grid-template-columns:minmax(0,1fr)}.tm svg{max-width:220px;margin:0 auto}}
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));border-radius:10px;overflow:hidden;background:#101418;color:#F4C542;font-variant-numeric:tabular-nums;text-align:center;font-weight:800;font-size:.78rem}
.board div{padding:5px 0;border-right:1px solid #2a3036}
.board .n{color:#E7ECF0;background:#1b2127}
.board .hit{background:#F4C542;color:#101418}
.seiri{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:64px;height:84px;border-radius:6px;background:#F7F3E8;color:#1b1b1b;border:1px solid #c9c2ad;flex:none;transform:rotate(-4deg)}
.seiri span{font-size:.72rem;font-weight:700}
.seiri b{font-size:1.9rem;line-height:1;font-weight:900}
.bus-top{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.bus-top .board{flex:1;min-width:0}
.tags{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ptag{position:relative;background:var(--surface-2);border-radius:8px 18px 18px 8px;padding:12px 12px 12px 26px;display:flex;flex-direction:column;min-width:0}
.ptag::before{content:"";position:absolute;left:10px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line)}
.ptag strong{font-size:1.35rem;font-weight:900;font-variant-numeric:tabular-nums}
.ptag small{font-family:var(--font-jp);font-weight:700;font-size:1rem;color:var(--accent)}
.ptag em{font-style:normal;font-size:.8rem;color:var(--muted);line-height:1.3}
.sos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sos div{background:var(--surface-2);border-radius:14px;padding:12px;min-width:0}
.sos strong{display:block;font-size:2.2rem;font-weight:900;line-height:1;color:var(--bad);font-variant-numeric:tabular-nums}
.sos span{font-size:.85rem;font-weight:700}
.sos small{display:block;font-family:var(--font-jp);color:var(--muted)}
.hotline{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--surface-2);border-radius:14px;padding:12px}
.hotline code{font-family:var(--font-ui);font-weight:900;font-size:1.15rem;user-select:all;font-variant-numeric:tabular-nums}
.hotline span{font-size:.85rem;flex-basis:100%}
.picto{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.picto div{background:var(--surface-2);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.picto svg{width:44px;height:36px}
.picto b{font-family:var(--font-jp);font-size:1.6rem;line-height:1.1}
.picto span{font-size:.75rem;color:var(--muted);font-weight:700}

/* words */
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:8px 10px 8px 0}
.row+.row{border-top:1px solid var(--line)}
.row-main{display:grid;grid-template-columns:5.6em minmax(0,1fr);gap:12px;align-items:center;background:none;border:0;text-align:left;padding:4px 0 4px 14px;cursor:pointer;min-width:0}
.row-jpw{display:flex;flex-direction:column;min-width:0}
.row-jp{font-family:var(--font-jp);font-weight:700;font-size:1.3rem;line-height:1.25;overflow-wrap:anywhere}
.row-kana{font-family:var(--font-jp);color:var(--muted);font-size:.74rem;line-height:1.3;overflow-wrap:anywhere}
.row-txt{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.row-say{font-weight:900;color:var(--accent)}
.row-txt .romaji{font-size:.82rem}
.row-mean{font-weight:700;font-size:.95rem}
.row-note{font-size:.82rem;color:var(--muted);margin-top:2px}
.row.sign .row-jp{display:inline-block;align-self:flex-start;background:var(--ink);color:var(--bg);border-radius:6px;padding:2px 6px;font-size:1.15rem}
.cat-intro{background:var(--note);color:var(--note-ink);border-radius:12px;padding:10px 12px;font-size:.94rem;margin:0 0 10px}
.cat-h{margin:24px 0 10px;font-size:1.05rem;font-weight:900}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:0 12px;margin-top:14px}
.searchbox:focus-within{border-color:var(--accent)}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:1.05rem;padding:12px 0;color:var(--ink);outline:none}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;color:var(--muted);text-align:center}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}

/* builder */
.tpl-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:16px}
.tpl{display:flex;flex-direction:column;align-items:flex-start;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.tpl.on{border:2px solid var(--accent);padding:9px 11px;background:var(--accent-soft)}
.tpl-jp{font-family:var(--font-jp);font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.tpl-ru{font-size:.82rem;font-weight:800;color:var(--muted)}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px}
.blk{font-family:var(--font-jp);font-weight:700;font-size:1.35rem;padding:8px 12px;border-radius:12px;background:var(--surface-2);line-height:1.2}
.blk.slot{background:var(--accent);color:var(--on-accent)}
.blk.p0{border:2px dashed var(--muted);background:transparent}
.plus{color:var(--muted);font-weight:900;font-size:1.2rem}
.how{color:var(--muted);font-size:.95rem;margin:10px 0 0}

/* learn */
.flash{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px 18px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.flash .jp{font-size:clamp(2rem,9vw,3rem)}
.flash .front-ru{font-size:1.5rem;font-weight:900;line-height:1.25}
.flash .divider{width:40px;height:4px;border-radius:2px;background:var(--line);margin:12px 0}
.learn-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 10px;flex-wrap:wrap}
.learn-top b{font-weight:900}
.progress{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-bottom:12px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.btn{border:0;border-radius:14px;padding:14px 12px;font-weight:900;font-size:1rem;cursor:pointer;background:var(--surface-2);text-decoration:none;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.good{background:var(--good);color:#fff}
.btn.wide{grid-column:1/-1}
.deck-h{margin:20px 0 8px;font-weight:900;font-size:.95rem}
.chip .cnt{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.on .cnt{color:inherit;opacity:.75}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;margin-top:14px}
.seg button{border:0;background:transparent;border-radius:10px;padding:8px 12px;font-weight:800;font-size:.88rem;cursor:pointer}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* read page */
.prose{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.prose p{margin:0 0 10px;max-width:65ch}
.prose ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.scripts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.scripts div{background:var(--surface-2);border-radius:14px;padding:12px;min-width:0}
.scripts b{display:block;font-family:var(--font-jp);font-size:1.5rem;line-height:1.2}
.scripts span{display:block;font-weight:900;font-size:.9rem}
.scripts p{margin:4px 0 0;font-size:.82rem;color:var(--muted);line-height:1.35}
@media (max-width:480px){.scripts{grid-template-columns:minmax(0,1fr)}}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.setting+.setting{border-top:1px solid var(--line)}
.setting input{width:22px;height:22px;accent-color:var(--accent)}
.setting label{font-weight:700}

/* show overlay */
.show{position:fixed;inset:0;z-index:100;background:var(--surface);display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(20px,env(safe-area-inset-left,0px))}
.show-bar{display:flex;justify-content:space-between;align-items:center}
.show-hint{font-size:.85rem;color:var(--muted);font-weight:700}
.show-body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;overflow-y:auto;min-height:0}
.show-jp{font-family:var(--font-jp);font-weight:700;line-height:1.25;overflow-wrap:anywhere;max-width:100%}
.show-jp[data-len="s"]{font-size:clamp(3rem,17vw,8rem)}
.show-jp[data-len="m"]{font-size:clamp(2.2rem,10vw,5rem)}
.show-jp[data-len="l"]{font-size:clamp(1.7rem,7.5vw,3.6rem)}
.show-kana{font-family:var(--font-jp);color:var(--muted);font-size:clamp(1rem,4.5vw,1.6rem)}
.show-en{font-size:clamp(1.1rem,5vw,1.7rem);font-weight:800}
.show-ru{color:var(--muted);font-size:1rem;margin-top:6px}
.show-ru b{color:var(--accent)}
.show-tools{display:flex;gap:10px;justify-content:center}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-weight:700;font-size:.9rem;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}

{id:"basics",L:"G",col:"#F39700",title:"Волшебные слова",sub:"Привет, спасибо, извините",words:["questions","pointers","people"],
intro:"Это слова-волшебники. Они нужны везде: в магазине, в поезде, в кафе. Если выучишь только их, тебя уже будут понимать и тебе будут улыбаться.",

["大丈夫です","だいじょうぶです","даидзёобу дэс","daijōbu desu","Всё хорошо / Не нужно, спасибо","I'm OK / No, thank you","Суперслово! «Пакет нужен?» — «Дайдзёобу дэс» значит «нет, спасибо». «Ты в порядке?» — «Дайдзёобу!» значит «да, всё хорошо»."],

["どうぞ","","доозо","dōzo","Пожалуйста (возьмите, проходите)","Here you go / After you","Когда ты что-то даёшь или пропускаешь вперёд. Если просишь ты — это уже «онэгаи симас»."],
["いただきます","","итадакимас","itadakimasu","Приятного аппетита (перед едой)","Let's eat","Говорят перед едой, сложив ладошки. Это «спасибо» тем, кто вырастил и приготовил еду."],

["分かりました","わかりました","вакаримасита","wakarimashita","Понятно / Хорошо","I understand / OK",""],

tips:["Для метро и электричек возьми карту Suica, PASMO или ICOCA (бывает и в Apple Wallet). Приложил к турникету — и прошёл. Каждому человеку нужна своя карта.","Бумажный билет турникет забирает на выходе — не выбрасывай его до конца поездки.","Не знаешь цену? Купи самый дешёвый билет, а перед выходом доплати в автомате 精算 (Fare Adjustment).","На синкансэн и экспрессы нужен отдельный билет — обычной картой их не оплатить.","Маршрут удобно строить в Google Maps или Navitime Japan Travel.","В вагоне не разговаривают по телефону и болтают тихо.","На эскалаторе в Токио стоят слева, а в Осаке — справа. Делай как все вокруг.","Обед в коробочке с вокзала (эки-бэн) можно есть прямо в синкансэне — это традиция."],

SITS.forEach(s=>{
  s.phrases.forEach((p,i)=>{ALL[`p-${s.id}-${i}`]={kind:"p",sid:s.id,...mk(p)}});
  s.hear.forEach((p,i)=>{ALL[`h-${s.id}-${i}`]={kind:"h",sid:s.id,...mk(p)}});
});
CATS.forEach(c=>{
  c.ids=[];

});
TPL.forEach((t,ti)=>t.items.forEach((x,ii)=>{
  ALL[`b-${ti}-${ii}`]={kind:"b",j:x[0]+t.parts.join(""),k:(x[1]||x[0])+t.kt,c:x[2]+" "+t.ct,r:x[3]+" "+t.rt,t:x[5],e:x[6],n:""};
}));
const norm = s => (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/ё/g,"е");

const sitIds = s => [...s.phrases.map((_,i)=>`p-${s.id}-${i}`),...s.hear.map((_,i)=>`h-${s.id}-${i}`)];

/* ---------- views ---------- */
const view=document.getElementById("view");
function vHome(){
  const nP=Object.values(ALL).filter(o=>o.kind==="p"||o.kind==="h").length, nW=Object.values(ALL).filter(o=>o.kind==="w").length;
  return `<section class="hero"><span class="eyebrow">Разговорник для поездки</span><h1>Японский в кармане</h1><p class="lead">Самые нужные слова и фразы — просто, как для 10-летнего. Выучи заранее, а в Японии открывай нужную ситуацию и показывай фразу на экране.</p><div class="stats"><span>${SITS.length} ситуаций</span><span>${nP} ${plural(nP,["фраза","фразы","фраз"])}</span><span>${nW} ${plural(nW,["слово","слова","слов"])}</span></div></section>
  <section class="sec"><h2>Нужно прямо сейчас</h2><div class="quick">${QUICK.map(id=>{const p=ALL[id];return `<button class="qchip" data-act="show" data-id="${id}"><span class="q-jp" lang="ja">${esc(p.j)}</span><span class="q-ru">${esc(p.t.split(" / ")[0])}</span></button>`}).join("")}</div></section>
  <section class="sec"><h2>Маршрут поездки</h2><div class="linemap">${SITS.map(s=>{const n=s.phrases.length+s.hear.length;return `<a class="stop" href="#s-${s.id}" style="--lc:${s.col}">${badge(s)}<span><span class="stop-t">${s.title}</span><span class="stop-s">${s.sub}</span></span><span class="stop-n">${n} ${plural(n,["фраза","фразы","фраз"])}${IC.chev}</span></a>`}).join("")}</div><p class="map-note">Каждая тема окрашена в цвет настоящей линии токийского метро, а номер — как номер станции на табличках.</p></section>
  <section class="sec"><h2>Инструменты</h2><div class="tools-grid">
    <a class="tool-tile" href="#build"><span class="tt-jp" lang="ja">～ください</span><b>Конструктор фраз</b><span>Собери свою фразу из слова и «хвостика»</span></a>
    <a class="tool-tile" href="#words-signs"><span class="tt-jp" lang="ja">出口</span><b>Таблички</b><span>Выход, вход, туалет, «закрыто»</span></a>
    <a class="tool-tile" href="#learn"><span class="tt-jp" lang="ja">覚える</span><b>Учить карточки</b><span>Проверь себя перед поездкой</span></a>
    <a class="tool-tile" href="#read"><span class="tt-jp" lang="ja">あア漢</span><b>Как читать</b><span>Три азбуки и как произносить</span></a>
  </div></section>`;
}
function vSit(id){
  const s=SITS.find(x=>x.id===id); if(!s) return vHome();
  const i=SITS.indexOf(s), prev=SITS[i-1], next=SITS[i+1];
  const jumps=[["sec-phrases","Фразы"]];
  if(s.hear.length) jumps.push(["sec-hear","Тебе скажут"]);
  jumps.push(["sec-dialog","Диалог"],["sec-tips","Советы"],["sec-words","Слова"]);
  return `<div style="--lc:${s.col}"><a class="back" href="#home">${IC.back}Маршрут</a>
  <div class="track">${badge(s,true)}${next?`<a class="nexttag" href="#s-${next.id}" style="--lc:${next.col}">Дальше: ${next.title}</a>`:""}</div>
  <h1>${s.title}</h1><p class="lead">${s.intro}</p>
  <div class="jump">${jumps.map(([t,l])=>`<button class="chip" data-act="jump" data-target="${t}">${l}</button>`).join("")}</div>
  <section class="sec" id="sec-phrases"><h2>Фразы <small>${s.phrases.length}</small></h2><div class="stack">${s.phrases.map((_,k)=>card(`p-${s.id}-${k}`)).join("")}</div></section>
  ${s.hear.length?`<section class="sec" id="sec-hear"><h2>Что тебе скажут</h2><p class="lead" style="margin:-4px 0 12px">Эти фразы говорить не нужно — важно понять их на слух.</p><div class="stack">${s.hear.map((_,k)=>card(`h-${s.id}-${k}`)).join("")}</div></section>`:""}
  <section class="sec" id="sec-dialog"><h2>Как это звучит</h2><div class="dlg"><div class="dlg-title">Ты и ${s.dialog.them.toLowerCase()}</div>${s.dialog.lines.map(([w,j,c,t],k)=>`<div class="bub ${w}"><span class="who">${w==="y"?"Ты":s.dialog.them}</span><div><div class="jp" lang="ja">${esc(j)}</div><div class="say">${esc(c)}</div><div class="mean">${esc(t)}</div></div><button class="tool" data-act="say" data-text="${esc(j)}" aria-label="Послушать">${IC.speaker}</button></div>`).join("")}</div></section>
  <section class="sec" id="sec-tips"><h2>Полезно знать</h2><ul class="tips">${s.tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>${s.ill.length?`<div class="figs">${s.ill.map(k=>ILL[k]()).join("")}</div>`:""}${s.src?`<p class="src">Подробнее: <a href="${s.src}" target="_blank" rel="noopener">статья на wrenjapan.com</a></p>`:""}</section>
  <section class="sec" id="sec-words"><h2>Слова по теме</h2><div class="chips-wrap">${s.words.map(c=>{const cat=CATS.find(x=>x.id===c);return `<a class="chip" href="#words-${c}">${cat.title} <span class="cnt">${cat.ids.length}</span></a>`}).join("")}</div></section>
  <section class="sec"><div class="tools-grid">${prev?`<a class="tool-tile" href="#s-${prev.id}"><span class="stop-n">${IC.back}Назад</span><b>${prev.title}</b></a>`:"<span></span>"}${next?`<a class="tool-tile" href="#s-${next.id}" style="text-align:right;align-items:flex-end"><span class="stop-n">Дальше${IC.chev}</span><b>${next.title}</b></a>`:""}</div></section></div>`;
}
function vWords(cat){
  const c=CATS.find(x=>x.id===cat);
  const chips=`<div class="jump"><a class="chip${!c?" on":""}" href="#words">Все</a>${CATS.map(x=>`<a class="chip${c&&c.id===x.id?" on":""}" href="#words-${x.id}">${x.title}</a>`).join("")}</div>`;
  const block=x=>`${x.intro?`<p class="cat-intro">${esc(x.intro)}</p>`:""}<div class="rows">${x.ids.map(row).join("")}</div>`;
  return `<section><h1>Словарь</h1><p class="lead">${Object.values(ALL).filter(o=>o.kind==="w").length} слов по темам. Нажми на слово — оно откроется крупно, чтобы показать японцу.</p>${chips}</section>
  ${c?`<section class="sec" style="margin-top:16px"><h2 style="margin-bottom:12px">${c.title}</h2>${block(c)}</section>`:CATS.map(x=>`<section class="sec" style="margin-top:22px"><h2 style="margin-bottom:10px">${x.title}</h2>${block(x)}</section>`).join("")}`;
}
let B={t:0,i:0};
function buildBox(){
  const T=TPL[B.t],it=T.items[B.i];
  return `<div class="tpl-list">${TPL.map((t,i)=>`<button class="tpl${i===B.t?" on":""}" data-act="tpl" data-i="${i}"><span class="tpl-jp" lang="ja">～${t.parts.join("")}</span><span class="tpl-ru">${t.name}</span></button>`).join("")}</div>
  <div class="formula"><span class="blk slot" lang="ja">${esc(it[0])}</span>${T.parts.map((p,k)=>`<span class="plus">+</span><span class="blk p${k}" lang="ja">${p}</span>`).join("")}</div>
  <p class="how">${esc(T.how)}</p>
  <h2 class="h-sm">Выбери слово</h2>
  <div class="chips-wrap">${T.items.map((x,i)=>`<button class="chip${i===B.i?" on":""}" data-act="item" data-i="${i}"><span lang="ja">${esc(x[0])}</span> ${esc(x[4])}</button>`).join("")}</div>
  <h2 class="h-sm">Готовая фраза</h2>${card(`b-${B.t}-${B.i}`)}`;
}
function vBuild(){return `<section><h1>Конструктор фраз</h1><p class="lead">Японские фразы собираются как конструктор: берёшь слово и пристёгиваешь к нему «хвостик». Выбери формулу, потом слово — и покажи готовую фразу японцу.</p></section><div id="build-box">${buildBox()}</div>`}
let L={deck:null,dir:"jr",queue:[],i:0,rev:false};
function deckInfo(key){
  if(key==="fav") return {name:"Избранное",ids:[...favs]};
  const [t,id]=key.split(":");
  if(t==="s"){const s=SITS.find(x=>x.id===id);return {name:s.title,ids:sitIds(s)}}
  const c=CATS.find(x=>x.id===id);return {name:c.title,ids:c.ids};
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function deckChip(key){const d=deckInfo(key);const k=d.ids.filter(id=>known.has(id)).length;return `<button class="chip" data-act="deck" data-deck="${key}"${d.ids.length?"":" disabled"}>${d.name} <span class="cnt">${k}/${d.ids.length}</span></button>`}
function learnBox(){
  if(!L.deck) return `<div class="seg" role="group" aria-label="Сторона карточки"><button class="${L.dir==="jr"?"on":""}" data-act="dir" data-dir="jr">Японский → русский</button><button class="${L.dir==="rj"?"on":""}" data-act="dir" data-dir="rj">Русский → японский</button></div>
  <div class="deck-h">Своя колода</div><div class="chips-wrap">${deckChip("fav")}</div>
  <div class="deck-h">Ситуации</div><div class="chips-wrap">${SITS.map(s=>deckChip("s:"+s.id)).join("")}</div>
  <div class="deck-h">Слова</div><div class="chips-wrap">${CATS.map(c=>deckChip("w:"+c.id)).join("")}</div>
  <p class="map-note">Цифры показывают, сколько карточек ты уже отметил «Знаю». Отметки хранятся только на этом устройстве.</p>`;
  const d=deckInfo(L.deck);
  const kn=d.ids.filter(id=>known.has(id)).length;
  if(L.i>=L.queue.length) return `<div class="learn-top"><b>${d.name}</b></div><div class="flash"><div class="front-ru">Готово!</div><p class="lead" style="text-align:center">Ты прошёл все карточки. Выучено ${kn} из ${d.ids.length}.</p></div><div class="btns"><button class="btn pri" data-act="restart">Ещё раз</button><button class="btn" data-act="decks">Другая колода</button></div>`;
  const id=L.queue[L.i],p=ALL[id];
  const jpBlock=`<div class="jp" lang="ja">${esc(p.j)}</div>${p.k&&p.k!==p.j?`<div class="kana" lang="ja">${esc(p.k)}</div>`:""}`;
  const front=L.dir==="jr"?jpBlock:`<div class="front-ru">${esc(p.t)}</div>`;
  const back=L.dir==="jr"?`<div class="say">${esc(p.c)}</div><div class="romaji">${esc(p.r)}</div><div class="mean">${esc(p.t)}</div>`:`${jpBlock}<div class="say">${esc(p.c)}</div><div class="romaji">${esc(p.r)}</div>`;
  return `<div class="learn-top"><button class="chip" data-act="decks">${IC.back}Колоды</button><b>${d.name} · ${L.i+1} из ${L.queue.length}</b></div><div class="progress"><i style="width:${Math.round(L.i/L.queue.length*100)}%"></i></div>
  <div class="flash">${front}${L.rev?`<div class="divider"></div>${back}`:""}</div>
  <div class="btns">${L.rev?`<button class="btn" data-act="again">Ещё повторю</button><button class="btn good" data-act="know">Знаю</button>`:`<button class="btn pri wide" data-act="reveal">Показать ответ</button>`}<button class="btn wide" data-act="speak" data-id="${id}">${IC.speaker}Послушать</button></div>`;
}
function vLearn(){return `<section><h1>Учить</h1><p class="lead">Посмотри на карточку, вспомни ответ, потом проверь себя. Невыученные карточки идут первыми.</p></section><div id="learn-box">${learnBox()}</div>`}
function vFav(){
  const ids=[...favs];
  if(!ids.length) return `<section><h1>Избранное</h1></section><div class="empty" style="margin-top:16px"><b>Пока пусто</b>Нажимай ★ на любой фразе или слове — они появятся здесь. Так перед поездкой можно собрать свой мини-разговорник.</div>`;
  const ph=ids.filter(id=>ALL[id].kind!=="w"),wd=ids.filter(id=>ALL[id].kind==="w");
  return `<section><h1>Избранное</h1><p class="lead">Твой личный разговорник. Хранится только в этом браузере на этом устройстве.</p></section>
  ${ph.length?`<section class="sec"><h2>Фразы <small>${ph.length}</small></h2><div class="stack">${ph.map(card).join("")}</div></section>`:""}
  ${wd.length?`<section class="sec"><h2>Слова <small>${wd.length}</small></h2><div class="rows">${wd.map(row).join("")}</div></section>`:""}`;
}
const pictos=[["M4 34 L14 12 L22 26 L30 4 L38 26 L44 16","山","гора"],["M22 34 V6 M22 14 L10 26 M22 14 L34 26 M8 14 H36","木","дерево"],["M24 6 L12 34 M22 14 L36 34","人","человек"],["M8 8 H36 V30 H8 Z","口","рот"],["M8 6 H36 V32 H8 Z M8 19 H36","日","солнце"]];
function vRead(){
  return `<section><h1>Как читать</h1><p class="lead">Японский пишут сразу тремя азбуками. Звучит страшно, но для поездки хватит понимать, что есть что.</p></section>
  <section class="sec"><h2>Три азбуки — как три команды</h2><div class="scripts">
   <div><b lang="ja">ひらがな</b><span>Хирагана</span><p>Круглые значки для японских слов и окончаний: <span lang="ja">すし</span> (суси), <span lang="ja">ありがとう</span>.</p></div>
   <div><b lang="ja">カタカナ</b><span>Катакана</span><p>Угловатые значки для слов из других языков. Подсказка: они часто похожи на английские! <span lang="ja">コーヒー</span> — коохии (coffee), <span lang="ja">タクシー</span> — такусии (taxi).</p></div>
   <div><b lang="ja">漢字</b><span>Кандзи</span><p>Иероглифы — значки-картинки из Китая. Один значок — целое слово или идея.</p></div>
  </div>
  <figure class="fig" style="margin-top:12px"><h3>Иероглифы когда-то были картинками</h3><div class="picto">${pictos.map(([d,k,r])=>`<div><svg viewBox="0 0 44 38"><path class="st" style="stroke-width:2.5" d="${d}"/></svg><b lang="ja">${k}</b><span>${r}</span></div>`).join("")}</div><figcaption>Сравни: 口 «рот» прячется в табличках 入口 (вход) и 出口 (выход). Вход — это «рот», в который входят.</figcaption></figure></section>
  <section class="sec"><h2>Как читать русские буквы</h2><div class="prose"><ul>
   <li><b>Двойная гласная — тяни звук.</b> «аригатоо» = «аригато-о». Это важно: <span lang="ja">おばさん</span> «обасан» — тётя, а <span lang="ja">おばあさん</span> «обаасан» — бабушка!</li>
   <li><b>«у» и «и» часто почти не слышно</b> в конце слова и между глухими звуками. Поэтому пишем «дэс», «симас», а не «дэсу», «симасу».</li>
   <li><b>«си» звучит мягко</b>, что-то между «си» и «щи». «дз» — мягкое «дж»: «дзюусу» (сок).</li>
   <li><b>Звука «л» нет.</b> Японское «р» звучит как что-то среднее между «р» и «л».</li>
   <li><b>Ударения почти нет.</b> Говори ровно, спокойно и чуть медленнее, чем обычно.</li>
   <li><b>Хитрые значки:</b> <span lang="ja">は</span> в роли «а вот насчёт…» читается «ва», <span lang="ja">を</span> — «о».</li>
  </ul></div></section>
  <section class="sec"><h2>Что показывать на карточках</h2><div class="prose">
   <div class="setting"><label for="set-kana">Подсказка хираганой над иероглифами</label><input type="checkbox" id="set-kana" data-setting="kana"${S.kana?" checked":""}></div>
   <div class="setting"><label for="set-romaji">Латиница (romaji)</label><input type="checkbox" id="set-romaji" data-setting="romaji"${S.romaji?" checked":""}></div>
   <div class="setting"><label for="set-en">Английский запасной вариант</label><input type="checkbox" id="set-en" data-setting="en"${S.en?" checked":""}></div>
  </div><p class="map-note">Кнопка «Послушать» использует японский голос твоего телефона или компьютера. Если звука нет — добавь японский голос в настройках озвучки устройства.</p></section>
  <section class="sec"><h2>Откуда всё это</h2><div class="prose"><p>Формат — как в тематических словарях-журналах: слова и фразы по ситуациям, с примерами. Советы о поездке собраны в том числе по материалам путеводителя <a href="https://wrenjapan.com/category/essentials/" target="_blank" rel="noopener">wrenjapan.com</a> (раздел «Самое важное»). Правила вроде Tax Free иногда меняются — перед поездкой проверь свежие новости.</p></div></section>`;
}
let lastQ="";
function vSearch(){return `<section><h1>Поиск</h1><label class="searchbox" for="q">${IC.search}<input id="q" type="search" placeholder="По-русски, латиницей или по-японски" autocomplete="off" enterkeyhint="search"></label></section><div id="qres"></div>`}
function renderSearch(){
  const box=document.getElementById("qres");if(!box)return;
  const q=norm(lastQ.trim());
  if(!q){box.innerHTML=`<div class="empty" style="margin-top:16px"><b>Что ищем?</b>Например: туалет, вода, eki, ありがとう</div>`;return}
  const hits=Object.entries(ALL).filter(([id,o])=>o.hay.includes(q));
  const ph=hits.filter(([,o])=>o.kind==="p"||o.kind==="h").slice(0,40).map(([id])=>id);
  const wd=hits.filter(([,o])=>o.kind==="w").slice(0,60).map(([id])=>id);
  if(!ph.length&&!wd.length){box.innerHTML=`<div class="empty" style="margin-top:16px"><b>Ничего не нашлось</b>Попробуй другое слово или загляни в конструктор фраз.</div>`;return}
  box.innerHTML=`${wd.length?`<section class="sec" style="margin-top:20px"><h2>Слова <small>${wd.length}</small></h2><div class="rows">${wd.map(row).join("")}</div></section>`:""}${ph.length?`<section class="sec" style="margin-top:20px"><h2>Фразы <small>${ph.length}</small></h2><div class="stack">${ph.map(card).join("")}</div></section>`:""}`;
}

/* ---------- router ---------- */
function route(){
  const h=decodeURIComponent((location.hash||"").slice(1))||"home";
  const i=h.indexOf("-"),v=i<0?h:h.slice(0,i),arg=i<0?"":h.slice(i+1);
  const V={s:()=>vSit(arg),words:()=>vWords(arg),build:vBuild,learn:vLearn,fav:vFav,read:vRead,search:vSearch};
  view.innerHTML=(V[v]||vHome)();
  const tab=v==="s"?"home":v;
  document.querySelectorAll(".tab").forEach(t=>{const on=t.dataset.tab===tab||(!V[v]&&t.dataset.tab==="home");t.classList.toggle("on",on);if(on)t.setAttribute("aria-current","page");else t.removeAttribute("aria-current")});
  window.scrollTo({top:0,behavior:"instant"});
  if(v==="search"){const q=document.getElementById("q");q.value=lastQ;renderSearch();setTimeout(()=>q.focus(),60)}
}
window.addEventListener("hashchange",route);

/* ---------- speech ---------- */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(text){
  if(!("speechSynthesis" in window)){toast("Озвучка недоступна в этом браузере");return}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang="ja-JP";u.rate=.85;
    const v=voices.find(v=>/^ja/i.test(v.lang));if(v)u.voice=v;
    else if(voices.length)toast("На устройстве нет японского голоса — звук может быть неправильным");
    speechSynthesis.speak(u);
  }catch(e){toast("Не получилось включить звук")}
}

/* ---------- show overlay ---------- */
const show=document.getElementById("show");let showId=null,wakeLock=null,lastFocus=null;
function openShow(id){
  const p=ALL[id];showId=id;lastFocus=document.activeElement;
  const jp=document.getElementById("show-jp");jp.textContent=p.j;jp.dataset.len=p.j.length<=6?"s":p.j.length<=14?"m":"l";
  document.getElementById("show-kana").textContent=p.k&&p.k!==p.j?p.k:"";
  document.getElementById("show-en").textContent=p.e||"";
  document.getElementById("show-ru").innerHTML=`<b>${esc(p.c)}</b> — ${esc(p.t)}`;
  document.getElementById("show-tools").innerHTML=`<button class="btn" data-act="speak" data-id="${id}">${IC.speaker}Послушать</button><button class="btn fav-btn" data-act="fav" data-id="${id}" aria-pressed="${isFav(id)}">${IC.star}${isFav(id)?"В избранном":"В избранное"}</button>`;
  show.hidden=false;document.body.classList.add("lock");
  document.getElementById("show-close").focus();
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>{wakeLock=l}).catch(()=>{})}catch(e){}
}
function closeShow(){show.hidden=true;document.body.classList.remove("lock");showId=null;try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null;if(lastFocus&&lastFocus.focus)lastFocus.focus()}

/* ---------- toast ---------- */
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},2600)}

/* ---------- events ---------- */
function toggleFav(id){
  if(favs.has(id))favs.delete(id);else favs.add(id);
  store.set("jp-favs",[...favs]);
  const on=favs.has(id);
  document.querySelectorAll(`[data-act="fav"][data-id="${id}"]`).forEach(b=>{b.classList.toggle("on",on);b.setAttribute("aria-pressed",on);if(b.classList.contains("fav-btn"))b.innerHTML=IC.star+(on?"В избранном":"В избранное")});
  toast(on?"Добавлено в избранное":"Убрано из избранного");
  if((location.hash||"")==="#fav"&&show.hidden){const y=scrollY;view.innerHTML=vFav();scrollTo(0,y)}
}
function startDeck(key){
  const d=deckInfo(key);if(!d.ids.length)return;
  L.deck=key;L.i=0;L.rev=false;
  const un=d.ids.filter(id=>!known.has(id)),kn=d.ids.filter(id=>known.has(id));
  L.queue=[...shuffle(un),...shuffle(kn)];
}
const reLearn=()=>{const b=document.getElementById("learn-box");if(b)b.innerHTML=learnBox()};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==="speak")speak(spoken(ALL[id]));
  else if(a==="say")speak(b.dataset.text);
  else if(a==="fav")toggleFav(id);
  else if(a==="show")openShow(id);
  else if(a==="close-show")closeShow();
  else if(a==="jump"){const t=document.getElementById(b.dataset.target);if(t)t.scrollIntoView({block:"start"})}
  else if(a==="tpl"){B={t:+b.dataset.i,i:0};document.getElementById("build-box").innerHTML=buildBox()}
  else if(a==="item"){B.i=+b.dataset.i;document.getElementById("build-box").innerHTML=buildBox()}
  else if(a==="dir"){L.dir=b.dataset.dir;reLearn()}
  else if(a==="deck"){startDeck(b.dataset.deck);reLearn();scrollTo(0,0)}
  else if(a==="decks"){L.deck=null;reLearn()}
  else if(a==="reveal"){L.rev=true;reLearn()}
  else if(a==="know"||a==="again"){const cid=L.queue[L.i];if(a==="know")known.add(cid);else{known.delete(cid);L.queue.push(cid)}store.set("jp-known",[...known]);L.i++;L.rev=false;reLearn()}
  else if(a==="restart"){startDeck(L.deck);reLearn()}
  else if(a==="copy"){const txt=b.dataset.copy;const sel=()=>{const el=document.getElementById("hotline-num");const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Номер выделен — скопируй его")};try{navigator.clipboard.writeText(txt).then(()=>toast("Номер скопирован"),sel)}catch(err){sel()}}
});
document.addEventListener("change",e=>{const k=e.target.dataset&&e.target.dataset.setting;if(!k)return;S[k]=e.target.checked;store.set("jp-settings",S);applySettings()});
document.addEventListener("input",e=>{if(e.target.id==="q"){lastQ=e.target.value;renderSearch()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!show.hidden)closeShow()});
route();
</script>
